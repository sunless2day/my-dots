font_family      Hack
bold_font        auto
font_size        16.0

background #1a1b26
foreground #c0caf5

shell_integration no-cursor

cursor_shape beam
cursor_beam_thickness 4
cursor #7aa2f7
cursor_text_color background
cursor_blink_interval 0.4 ease-in-out
cursor_stop_blinking_after 15.0

cursor_trail 3
cursor_trail_decay 0.1 0.3
cursor_trail_start_threshold 2

window_padding_width 10
background_opacity 0.8
background_blur 1

scrollback_lines 100000000
scrollback_pager_history_size 100
mouse_hide_wait 2
visual_bell_duration 1
visual_bell_color #404040

clear_all_shortcuts yes

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+r load_config_file

map ctrl+equal change_font_size all +2
map ctrl+minus change_font_size all -2
map ctrl+0 change_font_size all 0

map ctrl+e new_tab_with_cwd
map ctrl+z close_tab
map ctrl+w next_tab
map ctrl+q previous_tab

tab_bar_edge top
tab_bar_style separator
tab_separator "  │  "
tab_title_template "{index} {title}"
active_tab_foreground #7aa2f7
active_tab_background #1a1b26
inactive_tab_foreground #545c7e
inactive_tab_background #1a1b26
active_tab_font_style bold-italic
